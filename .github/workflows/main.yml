name: Build macOS App
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build the App
        run: |
          xcodebuild clean build -project DS3Activator.xcodeproj -scheme DS3Activator -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=${{ github.workspace }}/build
      - name: Upload Application
        uses: actions/upload-artifact@v4
        with:
          name: DS3Activator-App
          path: ${{ github.workspace }}/build/DS3Activator.app
