name: Build DS3Activator
on: [workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Executable
        run: |
          mkdir -p build
          swift build -c release
          cp .build/release/DS3Activator build/ 2>/dev/null || cp .build/release/DS3Activator-Executable build/ 2>/dev/null || find .build -type f -name "DS3Activator" -exec cp {} build/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: DS3Activator-Executable
          path: build/
